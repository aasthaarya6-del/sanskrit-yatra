<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<title>Sanskrit Yatra — Learn Sanskrit the Fun Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2450;
  --ink-soft:#5c5478;
  --card:#fffdf8;
  --sky:#7ec8ef;
  --sun:#ffd45c;
  --peach:#f08a72;
  --berry:#e85a9a;
  --grass:#2a9d8f;
  --grape:#6d5ce0;
  --leaf:#6fcf7a;
  --saffron:#e8a03a;
  --peacock:#1f8a7a;
  --shadow: 4px 4px 0 rgba(47,40,84,0.16);
  --rainbow:linear-gradient(90deg,#e07090 0%,#e8a03a 18%,#f4c95d 36%,#2a9d8f 54%,#3d7ea6 72%,#6d5ce0 88%,#e07090 100%);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  color:var(--ink);
  font-family:'Nunito','Noto Sans Devanagari',sans-serif;
  background:
    linear-gradient(180deg, rgba(232,160,58,0.18) 0%, rgba(244,201,93,0.14) 18%, transparent 36%),
    radial-gradient(ellipse at 18% 8%, rgba(255,236,210,0.95) 0 180px, transparent 181px),
    radial-gradient(ellipse at 88% 12%, rgba(232,247,242,0.85) 0 200px, transparent 201px),
    linear-gradient(180deg,#fff4e8 0%,#f6eefe 42%,#e7f7f2 100%);
}
body::before,body::after{position:fixed;pointer-events:none;z-index:0;line-height:1;}
body::before{content:"🦚"; top:14px;left:12px;font-size:44px;opacity:0.28;}
body::after{content:"🪷"; bottom:16px;right:12px;font-size:48px;opacity:0.3;}
.wrap{max-width:920px;margin:0 auto;padding:22px 16px 80px;position:relative;z-index:1;}
.wrap::before{
  content:"✨  🦚  🪷  ✨";
  display:block;text-align:center;letter-spacing:0.55em;
  font-size:16px;margin:0 0 12px;opacity:0.72;
}
.masthead{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:linear-gradient(var(--card),var(--card)) padding-box, var(--rainbow) border-box;
  border:4px solid transparent;border-radius:28px;
  padding:16px 20px;box-shadow:var(--shadow);margin-bottom:16px;
}
.masthead h1{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(26px,6vw,42px);
  margin:0;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.masthead h1 span{color:var(--saffron);}
.masthead .sub{font-size:15px;color:var(--ink-soft);font-weight:700;margin-top:4px;}
.otto{display:none;}
.wordgloss{
  font-size:14px;color:var(--ink-soft);font-weight:700;line-height:1.6;
  margin:2px 0 8px;
}
.buddy{
  font-size:52px;line-height:1;filter:drop-shadow(3px 3px 0 rgba(43,37,80,0.12));
  animation:bob 2.8s ease-in-out infinite;cursor:pointer;
}
.buddies{display:flex;align-items:flex-end;gap:4px;}
.buddy.peacock{font-size:58px;animation-delay:.4s;}
.float-notes{display:none;position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
body.music-on .float-notes{display:block;}
.float-notes i{
  position:absolute;bottom:-40px;font-style:normal;font-size:22px;opacity:0.38;
  animation:riseNote 10s linear infinite;color:var(--grape);
}
.float-notes i:nth-child(1){left:6%; animation-duration:11s;}
.float-notes i:nth-child(2){left:22%; animation-duration:8s; animation-delay:1.2s; font-size:18px;}
.float-notes i:nth-child(3){left:40%; animation-duration:12s; animation-delay:2s;}
.float-notes i:nth-child(4){left:58%; animation-duration:9s; animation-delay:.6s; font-size:26px;}
.float-notes i:nth-child(5){left:74%; animation-duration:10s; animation-delay:1.8s;}
.float-notes i:nth-child(6){left:88%; animation-duration:13s; animation-delay:2.4s; font-size:16px;}
@keyframes riseNote{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  12%{opacity:0.4;}
  100%{transform:translateY(-110vh) rotate(18deg);opacity:0;}
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rainbowbar{
  height:10px;width:128px;border-radius:999px;overflow:hidden;margin-bottom:8px;
  border:2px solid var(--ink); background:var(--rainbow);
}
.welcomebox{
  background:#f3edff;border:3px solid var(--grape);border-radius:22px;
  padding:14px 18px;margin-bottom:16px;font-size:16px;line-height:1.55;font-weight:700;
}
.welcomebox strong{color:var(--grape);}
.sarvam-desk{
  background:#eef8ff;border:3px solid var(--peacock);border-radius:22px;
  padding:14px 18px;margin-bottom:16px;
}
.sarvam-desk h3{font-family:'Fredoka',sans-serif;margin:0 0 6px;font-size:20px;}
.sarvam-desk textarea{
  width:100%;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0;
  font-family:'Nunito','Noto Sans Devanagari',sans-serif;font-size:16px;font-weight:700;min-height:84px;resize:vertical;
}
.overallbar{height:14px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:6px;}
.overallbar>div{height:100%;background:var(--rainbow);transition:width .4s ease;}
.progress-caption{font-size:14px;color:var(--ink-soft);font-weight:800;margin-bottom:0;}
.progress-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.progress-tools .btn{padding:7px 14px;font-size:13px;}
.journey{
  display:flex;overflow-x:auto;gap:12px;padding:18px 10px 22px;margin-bottom:6px;scrollbar-width:thin;
  background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:var(--shadow);position:relative;
}
.journey::before{
  content:"";position:absolute;left:10px;right:10px;top:50%;height:10px;
  transform:translateY(-50%);border-radius:999px;background:var(--rainbow);opacity:0.95;pointer-events:none;
}
.stamp{
  flex:0 0 auto;width:108px;height:124px;border-radius:22px 22px 48px 48px;border:3px solid var(--ink);
  background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;font-size:12px;font-weight:800;text-align:center;padding:18px 6px 10px;
  color:var(--ink); transition:transform .15s ease; position:relative;z-index:1;box-shadow:var(--shadow);
}
.stamp:nth-child(7n+1){background:#ffe4f0;}
.stamp:nth-child(7n+2){background:#ffe8cc;}
.stamp:nth-child(7n+3){background:#fff4b0;}
.stamp:nth-child(7n+4){background:#d4f8e4;}
.stamp:nth-child(7n+5){background:#d0f0ff;}
.stamp:nth-child(7n+6){background:#e6dcff;}
.stamp:nth-child(7n+7){background:#ffd8ee;}
.stamp:hover{transform:translateY(-4px) scale(1.04);}
.stamp .icon{font-size:26px;margin-bottom:2px;}
.stamp .stampen{font-size:10px;font-weight:700;opacity:0.8;margin-top:1px;}
.stamp.active{border-color:var(--berry);color:var(--berry);box-shadow:0 0 0 4px rgba(232,90,154,0.28);}
.stamp.done{color:#1f8a72;}
.stamp.done::after{content:"🦚";position:absolute;top:-10px;right:-4px;width:26px;height:26px;font-size:18px;display:flex;align-items:center;justify-content:center;}
.stamp .lv{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  background:var(--peacock);color:#fff;font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap;
}
.stamp.locked{opacity:0.5;cursor:not-allowed;filter:grayscale(.35);}
.stamp.locked:hover{transform:none;}
.stamp.extra{border-style:dashed;background:#fff;}
.levelchip{
  display:inline-block;font-size:13px;font-weight:800;letter-spacing:0.02em;
  background:var(--grape);color:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:4px 12px;margin-bottom:8px;
}
.levelchip.extra{background:var(--peach);}
.lockhint{
  background:#fff3d6;border:3px dashed var(--sun);border-radius:16px;
  padding:10px 14px;margin:0 0 14px;font-weight:800;font-size:15px;
}
.level-up{position:fixed;inset:0;background:rgba(43,37,80,0.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;}
.level-up-card{
  background:var(--card);border:4px solid var(--ink);border-radius:28px;
  padding:28px 22px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow);animation:pop .35s ease;
}
.level-up-card .burst{font-size:52px;line-height:1;margin-bottom:8px;}
.level-up-card h3{font-family:'Fredoka',sans-serif;font-size:28px;margin:0 0 6px;}
.level-up-card p{font-weight:800;color:var(--ink-soft);margin:0 0 16px;line-height:1.45;}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.card{
  background:linear-gradient(var(--card),var(--card)) padding-box, var(--rainbow) border-box;
  border:4px solid transparent;border-radius:28px;padding:24px 24px 26px;box-shadow:var(--shadow);margin-bottom:18px;
}
.card h2{font-family:'Fredoka','Noto Sans Devanagari',sans-serif;font-size:clamp(24px,4vw,34px);margin:0 0 6px;}
.card .tagline{color:var(--ink-soft);font-size:16px;margin-bottom:16px;font-weight:700;}
.section-label{
  display:inline-block;font-size:13px;letter-spacing:0.02em;font-weight:800;
  color:#fff;background:var(--grape);margin:20px 0 12px;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);
}
.section-label:first-of-type{margin-top:4px;}
.tiles{display:flex;flex-wrap:wrap;gap:10px;}
.tile{
  display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:18px;
  padding:10px 12px;cursor:pointer;font-weight:800;font-size:16px;
  transition:transform .12s ease; box-shadow:3px 3px 0 rgba(43,37,80,0.08);
}
.tile:hover{background:#fff6d6;transform:translateY(-2px);}
.tile .en{font-weight:700;color:var(--ink-soft);font-size:13px;}
.tile .rom{font-weight:700;color:var(--peacock);font-size:12px;}
.tile.swatch{padding-left:10px;}
.swatchdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:inline-block;}
table.conj{width:100%;border-collapse:separate;border-spacing:0;margin-top:6px;font-size:16px;overflow:hidden;border-radius:16px;border:3px solid var(--ink);}
table.conj th{text-align:left;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:#fff;background:var(--peacock);padding:10px 10px;}
table.conj td{padding:10px;border-bottom:2px solid #f0ecff;background:#fff;}
table.conj tr:last-child td{border-bottom:none;}
table.conj td.pron{font-weight:800;width:110px;}
table.conj tr:hover td{background:#fff8e8;}
.audio-td{cursor:pointer;width:44px;}
button.btn{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;
  background:var(--grape);color:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:11px 20px;cursor:pointer;box-shadow:4px 4px 0 rgba(47,40,84,0.18);
}
button.btn:hover{background:var(--berry);transform:translateY(-1px);}
button.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--ink);}
button.btn.ghost:hover{background:var(--sun);color:var(--ink);}
button.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.spk{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);
  background:var(--sun);cursor:pointer;font-size:15px;flex:0 0 auto;
  vertical-align:middle;margin-left:4px;box-shadow:3px 3px 0 rgba(47,40,84,0.14);
}
.spk:hover{background:#ffe27a;transform:scale(1.08);}
.spk.first-spk{animation:pulse 1.6s ease-in-out infinite;background:#ffe14a;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,0.7)}50%{box-shadow:0 0 0 6px rgba(255,209,102,0)}}
.deword{display:inline-flex;align-items:center;gap:2px;white-space:nowrap;}
.deword .de{color:var(--peacock);font-family:'Noto Sans Devanagari',sans-serif;}
.gloss{color:var(--ink-soft);font-weight:700;font-size:0.92em;white-space:normal;}
.qwrap{background:#fbf4ee;border:2px dashed #e8c9b8;border-radius:20px;padding:16px 18px;margin-top:10px;}
.qprompt{font-weight:800;font-size:18px;margin-bottom:12px;line-height:1.45;}
.qopt{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;background:#fff;border:3px solid var(--ink);
  border-radius:16px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:16px;
  font-family:'Nunito','Noto Sans Devanagari',sans-serif;font-weight:800;
}
.qopt:hover{background:#fff3d6;}
.qopt.correct{background:#d8ffef;border-color:var(--grass);}
.qopt.incorrect{background:#ffe0ea;border-color:var(--berry);}
.qopt:disabled{cursor:default;}
.qfeedback{font-size:15px;font-weight:800;margin-top:8px;}
.qfeedback.ok{color:#0f8f84;}
.qfeedback.bad{color:var(--berry);}
.qfeedback.try{color:#b56a2c;}
.progressline{font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:800;}
.fillrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:16px;font-weight:700;}
.fillrow input{
  border:3px solid var(--ink);border-radius:12px;background:#fff;
  font-family:'Fredoka','Noto Sans Devanagari',sans-serif;font-size:16px;font-weight:700;width:160px;padding:6px 8px;text-align:center;color:var(--ink);
}
.fillrow input:focus{outline:none;border-color:var(--berry);background:#fff8e8;}
.fillrow input.ok{border-color:var(--grass);color:#0f8f84;background:#edfffb;}
.fillrow input.bad{border-color:var(--berry);color:var(--berry);background:#fff0f6;}

.sa-hint{width:100%;font-size:13px;font-weight:800;color:var(--peacock);margin:-4px 0 8px;flex:1 0 100%;}
.btnrow .sarvam-tr{flex:1 0 100%;}
.sarvam-wrap{position:relative;}
.sarvam-panel{
  position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(320px,86vw);
  background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;
  box-shadow:var(--shadow);text-align:left;
}
.sarvam-title{font-family:'Fredoka',sans-serif;font-weight:700;margin-bottom:6px;}
.sarvam-panel input{
  width:100%;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;margin:8px 0;
  font-family:inherit;font-weight:700;
}
.sarvam-status{font-size:13px;font-weight:800;margin-top:8px;color:var(--ink-soft);}
.sarvam-status.ok{color:#0f8f84;}
.sarvam-status.bad{color:var(--berry);}
.sarvam-tr{background:#eef8ff;border:2px dashed #9ec9e8;border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:700;line-height:1.5;}

.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.matchcol{display:flex;flex-direction:column;gap:8px;}
.matchitem{
  background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;
  cursor:pointer;font-size:15px;font-weight:800;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.matchitem.sel{border-color:var(--sun);background:#fff3d6;}
.matchitem.paired{border-color:var(--grass);background:#d8ffef;color:#0f8f84;cursor:default;}
.matchitem.wrongflash{border-color:var(--berry);background:#ffe0ea;}
.flashcard{
  background:linear-gradient(180deg,#fffefb 0%,#f6ecd4 100%);
  border:4px solid var(--ink);border-radius:28px;min-height:200px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  cursor:pointer;font-family:'Fredoka','Noto Sans Devanagari',sans-serif;font-size:32px;text-align:center;padding:20px;
  box-shadow:var(--shadow);margin-bottom:16px;user-select:none;
}
.flashcard .hint{font-family:'Nunito',sans-serif;font-size:14px;color:var(--ink-soft);margin-top:10px;font-weight:800;}
.flashnav{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink-soft);font-weight:800;}
.passage{
  background:#fffdf8;border:2px solid #eadfc8;border-radius:20px;
  padding:22px 24px;font-size:22px;line-height:2;margin-bottom:12px;font-weight:600;
  font-family:'Noto Sans Devanagari',sans-serif;text-align:justify;
}
.passage p{margin:0 0 1em;}
.passage p:last-child{margin-bottom:0;}
.story-shelf-label{font-family:'Fredoka',sans-serif;font-size:18px;margin:4px 0 8px;}
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0 0 16px;}
.story-card{
  text-align:left;background:#fff;border:3px solid var(--ink);border-radius:18px;
  padding:12px 14px;cursor:pointer;font-family:'Nunito',sans-serif;
  box-shadow:3px 3px 0 rgba(43,37,80,0.08);
}
.story-card:nth-child(6n+1){background:#fff3b8;}
.story-card:nth-child(6n+2){background:#ffd6ea;}
.story-card:nth-child(6n+3){background:#c8f5dc;}
.story-card:nth-child(6n+4){background:#c8ecff;}
.story-card:nth-child(6n+5){background:#ffe0c4;}
.story-card:nth-child(6n+6){background:#e0d4ff;}
.story-card:hover{filter:brightness(1.03);transform:translateY(-2px);}
.story-card.on{border-color:var(--berry);box-shadow:0 0 0 4px rgba(232,90,154,0.25);}
.story-card .st{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;display:block;margin-bottom:4px;}
.story-card .sb{font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.35;display:block;}
.songbox{
  background:#f7f1e8;border:2px dashed #e5d7b4;border-radius:20px;
  padding:16px 18px;margin:0 0 16px;white-space:pre-line;
  font-family:'Noto Sans Devanagari',sans-serif;font-size:20px;font-weight:700;line-height:1.7;
}
.shloka-card{
  background:linear-gradient(180deg,#fff8e4 0%,#f7ead0 100%);
  border:3px solid var(--ink);border-radius:22px;padding:16px 18px;margin:12px 0 16px;
  box-shadow:3px 3px 0 rgba(43,37,80,0.08);
}
.shloka-card .sh-kicker{
  font-size:13px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;
  color:#9a4b00;margin:0 0 6px;
}
.shloka-card h3{font-family:'Fredoka',sans-serif;font-size:20px;margin:0 0 8px;}
.shloka-lines{
  font-family:'Noto Sans Devanagari',sans-serif;font-size:clamp(20px,4vw,26px);
  font-weight:700;line-height:1.85;text-align:center;margin:8px 0 10px;
}
.shloka-rom{text-align:center;font-weight:800;color:var(--peacock);font-size:14px;margin:0 0 8px;}
.shloka-en{text-align:center;font-weight:700;color:var(--ink-soft);font-size:15px;margin:0 0 10px;line-height:1.45;}
.moral{
  background:#e8f7f0;border:3px dashed var(--peacock);border-radius:16px;
  padding:12px 14px;font-weight:800;font-size:15px;line-height:1.5;margin:8px 0 0;
}
.moral strong{color:#1f8a7a;}
.actbox{
  background:#fff0f6;border:3px dashed var(--berry);border-radius:16px;
  padding:12px 14px;margin:10px 0 14px;font-weight:800;font-size:15px;line-height:1.5;
}
.glossary-panel{background:#f4f0f8;border:2px solid #e2d8c8;border-radius:20px;padding:14px 16px;margin:0 0 16px;}
.glossary-panel h3{font-family:'Fredoka',sans-serif;font-size:18px;margin:0 0 4px;}
.glossary-panel .hint{font-size:14px;font-weight:700;color:var(--ink-soft);margin:0 0 12px;}
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 12px;}
.glossary-item{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #d8d0f5;border-radius:12px;padding:8px 10px;font-size:15px;font-weight:700;}
.glossary-item strong{color:var(--peacock);font-family:'Noto Sans Devanagari',sans-serif;}
.glossary-item .en{color:var(--ink-soft);font-weight:700;}
.badge{
  display:inline-flex;align-items:center;gap:6px;background:var(--grass);color:#fff;
  font-size:15px;font-weight:800;padding:8px 14px;border-radius:999px;margin-top:8px;border:3px solid var(--ink);
}
.explainer{background:#eef6f2;border:2px solid #c9dfd4;padding:14px 16px;border-radius:18px;font-size:16px;color:var(--ink);margin-bottom:16px;line-height:1.55;font-weight:700;}
.explainer strong{color:#1f8a7a;}
.tipbox{background:#f7f1e0;border:2px solid #e5d7b4;border-radius:18px;padding:14px 16px;margin-bottom:16px;font-size:16px;line-height:1.55;font-weight:700;}
.tipbox strong{color:#9a4b00;}
.note{font-size:15px;color:var(--ink-soft);margin:0 0 10px;font-weight:700;line-height:1.5;}
.summarybox{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 18px;margin-top:14px;}
.summaryrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px solid #f0ecff;font-size:15px;font-weight:800;}
.summaryrow:last-child{border-bottom:none;}
.weak{color:var(--berry);font-weight:800;}
.strong{color:#007a62;font-weight:800;}
.speedbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.speedbar .lbl{font-size:12px;font-weight:800;color:var(--ink-soft);}
.speedbar .btn{padding:7px 12px;font-size:13px;}
.recapcard{border-color:#e8c9b8;background:#fbf4ee;}
.speaklist{display:flex;flex-direction:column;gap:10px;}
.speakrow{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;}
.speakrow .line-de{font-family:'Noto Sans Devanagari',sans-serif;font-size:22px;font-weight:700;}
.speakrow .line-en{color:var(--ink-soft);font-size:14px;font-weight:700;margin:4px 0 10px;}
.speakrow .listening{background:var(--berry)!important;color:#fff;}
.lsrw-rail{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px;}
.lsrw-pill{font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;border:2.5px solid var(--ink);box-shadow:2px 2px 0 rgba(43,37,80,0.08);}
.lsrw-pill.L{background:#8fd6ff;}
.lsrw-pill.S{background:#ffe14a;}
.lsrw-pill.R{background:#7ee8a8;}
.lsrw-pill.W{background:#ffb089;}
.phase{margin:22px 0 12px;padding:12px 14px;border-radius:16px;border:3px solid var(--ink);font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;}
.phase .phase-blurb{font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:var(--ink-soft);margin-top:4px;}
.phase.L{background:#eaf4f8;}
.phase.S{background:#f8f3e6;}
.phase.R{background:#eaf5ef;}
.phase.W{background:#f8eee8;}
@media(max-width:600px){
  .matchgrid{grid-template-columns:1fr;}
  .card{padding:18px 14px;}
  .buddy{font-size:40px;}
}
@media (prefers-reduced-motion: reduce){
  .buddy,.spk.first-spk,body::before,.float-notes i{animation:none;}
  .float-notes{display:none !important;}
}

const ONES=["शून्यम्","एकम्","द्वे","त्रीणि","चत्वारि","पञ्च","षट्","सप्त","अष्ट","नव"];
const TEENS=["दश","एकादश","द्वादश","त्रयोदश","चतुर्दश","पञ्चदश","षोडश","सप्तदश","अष्टादश","नवदश"];
const TENS={20:"विंशतिः",30:"त्रिंशत्",40:"चत्वारिंशत्",50:"पञ्चाशत्",60:"षष्टिः",70:"सप्ततिः",80:"अशीतिः",90:"नवतिः"};
const TENS_STEM={20:"विंशतिः",30:"त्रिंशत्",40:"चत्वारिंशत्",50:"पञ्चाशत्",60:"षष्टिः",70:"सप्ततिः",80:"अशीतिः",90:"नवतिः"};
const COMPOUND_PREFIX=["","एक","द्वा","त्रयो","चतुर्","पञ्च","षड्","सप्त","अष्टा","नव"];
function numberWord(n){
  n=Number(n);
  if(n<=9) return ONES[n];
  if(n<=19) return TEENS[n-10];
  if(n===100) return "शतम्";
  const t=Math.floor(n/10)*10, u=n%10;
  if(u===0) return TENS[t];
  if(t===20) return COMPOUND_PREFIX[u]+"विंशतिः";
  if(t===30) return (u===1?"एक":u===2?"द्वा":u===8?"अष्टा":ONES[u].replace(/म्$/,"").replace(/े$/,"े"))+"त्रिंशत्";
  return ONES[u]+" च "+TENS[t];
}
function numberWordBig(n){
  n=Number(n);
  if(n<=100) return numberWord(n);
  if(n<1000){
    const h=Math.floor(n/100), rem=n%100;
    const hundreds=["","शतम्","द्विशतम्","त्रिशतम्","चतुःशतम्","पञ्चशतम्","षट्शतम्","सप्तशतम्","अष्टशतम्","नवशतम्"];
    return hundreds[h]+(rem?(" "+numberWord(rem)):"");
  }
  if(n<10000){
    const th=Math.floor(n/1000), rem=n%1000;
    const thousands=["","सहस्रम्","द्विसहस्रम्","त्रिसहस्रम्","चतुःसहस्रम्","पञ्चसहस्रम्","षट्सहस्रम्","सप्तसहस्रम्","अष्टसहस्रम्","नवसहस्रम्"];
    return thousands[th]+(rem?(" "+numberWordBig(rem)):"");
  }
  return String(n);
}

function saTokens(text){
  return String(text||'').replace(/[“”"‘’]/g,' ').split(/[\s,।॥.!?—\-:;]+/).map(w=>w.trim()).filter(w=>/[\u0900-\u097F]/.test(w));
}
function meaningOf(word){
  if(WORD_MEANINGS[word]) return WORD_MEANINGS[word];
  const cut=word.replace(/ः$/,'').replace(/म्$/,'म्');
  if(WORD_MEANINGS[cut]) return WORD_MEANINGS[cut];
  if(WORD_MEANINGS[word+'ः']) return WORD_MEANINGS[word+'ः'];
  return '';
}
function fullGlossary(story){
  const seen=new Set(), out=[];
  function add(w,m){
    if(!w || seen.has(w) || !m) return;
    seen.add(w); out.push([w,m]);
  }
  (story.glossary||[]).forEach(([w,m])=>add(w,m));
  saTokens(story.text).forEach(w=>add(w, meaningOf(w) || w));
  return out;
}
function wordByWord(sa){
  return saTokens(sa).map(w=>{
    const m=meaningOf(w);
    return m ? (w+' = '+m) : w;
  }).join('  ·  ');
}

function isIndicVoice(v){
  const lang=(v.lang||'').toLowerCase();
  const name=(v.name||'').toLowerCase();
  return lang.startsWith('sa') || lang.startsWith('hi') || /hindi|हिन्दी|devanagari|sanskrit/.test(name);
}
function isFemaleVoice(v){
  const lang=(v.lang||'').toLowerCase();
  const name=(v.name||'').toLowerCase();
  if(/hemant|ravi|rishi|kumar|david|mark|george|daniel|guy|male|man\b/.test(name)) return false;
  if((lang.startsWith('hi') || lang.startsWith('sa')) && /google/.test(name)) return true;
  return /swara|kalpana|heera|neerja|vaani|vani|veena|aditi|shruti|ananya|pallavi|lekha|female|woman|girl|zira|samantha|kendra|aria|natural/.test(name)
    || /google हिन्दी|google hindi/.test(name);
}
function pickSanskritVoice(){
  const score=v=>{
    const lang=(v.lang||'').toLowerCase();
    const name=(v.name||'').toLowerCase();
    const female=isFemaleVoice(v);
    const hindi=lang.startsWith('hi') || /hindi|हिन्दी/.test(name);
    const sanskrit=lang.startsWith('sa') || /sanskrit|संस्कृत/.test(name);
    let n=0;
    if(sanskrit && female) n=320;
    else if(hindi && female && /google/.test(name)) n=300;
    else if(hindi && female && /swara|kalpana|heera|vaani|vani|neerja/.test(name)) n=290;
    else if(hindi && female) n=270;
    else if(sanskrit) n=240;
    else if(hindi) n=200;
    else if(lang.startsWith('en-in') && female) n=80;
    else if(lang.startsWith('en-in')) n=50;
    else if(female) n=20;
    if(/hemant|ravi|male/.test(name)) n=Math.min(n, 25);
    return n;
  };
  let best=null, bestN=-1;
  cachedVoices.forEach(v=>{ const n=score(v); if(n>bestN){ bestN=n; best=v; } });
  return bestN>0 ? best : null;
}
function romanToDevanagari(raw){
  let s=String(raw||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(!s.trim()) return '';
  s=s.replace(/ā/g,'aa').replace(/ī/g,'ii').replace(/ū/g,'uu').replace(/ṛ|ṝ/g,'ri')
    .replace(/ś|ṣ/g,'sh').replace(/ñ/g,'ny').replace(/ṅ/g,'ng').replace(/ṇ/g,'n')
    .replace(/ṃ|ṁ/g,'m').replace(/ḥ/g,'h');
  s=s.replace(/ah(?=\s|$|[.,!?;:।॥])/g,'aH');
  const cons=[
    ['ksh','क्ष'],['gy','ज्ञ'],['jn','ज्ञ'],
    ['kh','ख'],['gh','घ'],['chh','छ'],['ch','च'],['jh','झ'],['th','थ'],['dh','ध'],
    ['ph','फ'],['bh','भ'],['sh','श'],['ng','ङ'],
    ['k','क'],['g','ग'],['c','च'],['j','ज'],['t','त'],['d','द'],['n','न'],
    ['p','प'],['b','ब'],['m','म'],['y','य'],['r','र'],['l','ल'],['v','व'],['w','व'],['s','स'],['h','ह']
  ];
  const ind={'aa':'आ','ai':'ऐ','au':'औ','ii':'ई','ee':'ई','uu':'ऊ','oo':'ऊ','ri':'ऋ','a':'अ','i':'इ','u':'उ','e':'ए','o':'ओ'};
  const mat={'aa':'ा','ai':'ै','au':'ौ','ii':'ी','ee':'ी','uu':'ू','oo':'ू','ri':'ृ','i':'ि','u':'ु','e':'े','o':'ो','a':''};
  const vOrder=['ai','au','aa','ii','ee','uu','oo','ri','a','i','u','e','o'];
  function grabCons(i){
    for(let k=0;k<cons.length;k++){ if(s.startsWith(cons[k][0], i)) return cons[k]; }
    return null;
  }
  function grabVow(i){
    for(let k=0;k<vOrder.length;k++){ if(s.startsWith(vOrder[k], i)) return vOrder[k]; }
    return '';
  }
  let out='', i=0;
  while(i<s.length){
    const ch=s[i];
    if(/\s/.test(ch)){ out+=' '; i++; continue; }
    if(ch==='H'){ out+='ः'; i++; continue; }
    if(/[.,!?;:'"()।॥]/.test(ch)){ out+=ch; i++; continue; }
    const c=grabCons(i);
    if(c){
      i+=c[0].length;
      const v=grabVow(i);
      if(v){ out+=c[1]+mat[v]; i+=v.length; }
      else out+=c[1]+'्';
      continue;
    }
    const v=grabVow(i);
    if(v){ out+=ind[v]; i+=v.length; continue; }
    i++;
  }
  return out;
}
function toDevanagariSpeech(text){
  const ROMAN_SA={
    mama:'मम', nama:'नाम', namaste:'नमस्ते', namaskarah:'नमस्कारः',
    aham:'अहम्', asmi:'अस्मि', asi:'असि', asti:'अस्ति', tvam:'त्वम्',
    vayam:'वयम्', sah:'सः', dhanyavadah:'धन्यवादः', punarmilamah:'पुनर्मिलामः',
    vedark:'वेदार्कः', vedarkah:'वेदार्कः', himaya:'हिमाया', himaaya:'हिमाया', aarshena:'आर्षेणा', arshena:'आर्षेणा', shukah:'शुकः', mayurah:'मयूरः'
  };
  return String(text||'').split(/(\s+)/).map(part=>{
    if(!part.trim() || /[\u0900-\u097F]/.test(part)) return part;
    const m=part.match(/^([^a-zA-Zāīū]*)([a-zA-Zāīūṛśṣñṅṇṃṁḥ]+)([^a-zA-Z]*)$/);
    if(m && ROMAN_SA[m[2].toLowerCase()]) return m[1]+ROMAN_SA[m[2].toLowerCase()]+m[3];
    if(!/[a-zA-Zāīūṛśṣñṅṇṃṁḥ]/.test(part)) return part;
    return romanToDevanagari(part) || part;
  }).join('');
}
function sanskritRoman(dev){
  const ind={'अ':'a','आ':'aa','इ':'i','ई':'ee','उ':'u','ऊ':'oo','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au'};
  const cons={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ळ':'l'};
  const mat={'ा':'aa','ि':'i','ी':'ee','ु':'u','ू':'oo','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au'};
  const chars=Array.from(String(dev||''));
  let out='';
  for(let i=0;i<chars.length;i++){
    const ch=chars[i], next=chars[i+1]||'';
    if(ind[ch]){ out+=ind[ch]; continue; }
    if(cons[ch]){
      if(next==='्'){ out+=cons[ch]; i++; continue; }
      if(mat[next]){
        const vis=chars[i+2]==='ः';
        out+=cons[ch]+mat[next]+(vis?'h':'');
        i+=vis?2:1;
        continue;
      }
      if(next==='ं'||next==='ँ'){ out+=cons[ch]+'am'; i++; continue; }
      if(next==='ः'){ out+=cons[ch]+'ah'; i++; continue; }
      out+=cons[ch]+'a';
      continue;
    }
    if(ch==='ः'){ out+='h'; continue; }
    if(ch==='।'||ch==='॥'){ out+=' '; continue; }
    if(/\s/.test(ch)) out+=' ';
    else if(/[.,!?;:]/.test(ch)) out+=ch;
  }
  return out.replace(/\s+/g,' ').trim();
}
function speakableRoman(text){
  let r=sanskritRoman(toDevanagariSpeech(text));
  r=r.replace(/vedaarkah/gi,'vedarkah').replace(/\bvedaarka\b/gi,'vedarkah').replace(/\bvedarka\b/gi,'vedarkah');
  r=r.replace(/\bhimayaa\b/gi,'himaaya').replace(/\bhimaya\b/gi,'himaaya');
  r=r.replace(/\bgrihnaati\b/g,'grihanati').replace(/\bgrihnati\b/g,'grihanati');
  r=r.replace(/\bkridami\b/g,'kreedaami');
  r=r.replace(/\bsidhyanti\b/g,'siddhyanti');
  r=r.replace(/\bna hi\b/g,'nahi');
  r=r.replace(/\bmum\b/g,'mama');
  return r;
}
function keepSanskritSchwa(s){
  const CONS=/[\u0915-\u0939\u0958-\u095F]/;
  const SKIP=/[\u093A-\u094D\u0901-\u0903\u093C\u0962\u0963]/;
  const chars=Array.from(String(s||''));
  let out='';
  for(let i=0;i<chars.length;i++){
    const ch=chars[i], next=chars[i+1]||'';
    if(CONS.test(ch) && !SKIP.test(next) && (!next || CONS.test(next) || /[\s।॥.,!?;:]/.test(next))){
      out+=ch+'्अ';
    } else {
      out+=ch;
    }
  }
  return out;
}
function hindiSpeechFixes(dev){
  let d=String(dev||'');
  d=d.replace(/ऋषिका/g,'आर्षेणा');
  d=d.replace(/हिमया/g,'हिमाया');
  d=d.replace(/वेदार्क(?!ः)/g,'वेदार्कः');
  d=d.replace(/गृह्णाति/g,'गृहनति');
  d=d.replace(/सिध्यन्ति/g,'सिद्ध्यन्ति');
  d=d.replace(/न हि/g,'नहि');
  d=keepSanskritSchwa(d);
  d=d.replace(/ः/g,'ह');
  return d;
}
function prepSanskritSpeech(text, voice){
  if(voice && isIndicVoice(voice)) return hindiSpeechFixes(toDevanagariSpeech(text));
  return speakableRoman(text);
}
function chunkSaSpeech(text){
  const t=String(text||'').replace(/\s+/g,' ').trim();
  if(!t) return [];
  const parts=t.split(/[।॥.!?]+/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  parts.forEach(s=>{
    if(s.length<=180){ out.push(s); return; }
    let piece='';
    s.split(/\s+/).forEach(w=>{
      if(piece && (piece+' '+w).length>180){ out.push(piece); piece=w; }
      else piece=piece?piece+' '+w:w;
    });
    if(piece) out.push(piece);
  });
  return out.length?out:[t];
}

function startBand(){

    const now=ctx.currentTime;
    playAt(SA, now, 0.8, 'triangle', 0.42);
    playAt(GA, now+0.1, 0.8, 'triangle', 0.28);
    playAt(PA, now+0.18, 0.85, 'triangle', 0.32);
    Music.nextTime=now+1.1;
    (function pump(){
      if(!Music.playing || !state.musicOn || !Music.ctx) return;
      const t=Music.ctx.currentTime;
      while(Music.nextTime < t+1.6){
        const note=TUNE[Music.step%TUNE.length];

function playNoiseClick(when, dur, vol){

  if(!ctx || !Music.sfx) return;
  const n=Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buf=ctx.createBuffer(1, n, ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/n, 2.2);
  const src=ctx.createBufferSource();
  src.buffer=buf;
  const hp=ctx.createBiquadFilter();
  hp.type='highpass'; hp.frequency.value=1600;
  const g=ctx.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.001, when+dur);

function looksSanskrit(str){

function foldSa(s){
  let t=String(s||'').toLowerCase().trim();
  t=t.replace(/[\u0900-\u097F]+/g,(dev)=>{
    const map={
      'अ':'a','आ':'aa','इ':'i','ई':'ii','उ':'u','ऊ':'uu','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au',
      'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n',
      'ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n',
      'प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h',
      'ा':'aa','ि':'i','ी':'ii','ु':'u','ू':'uu','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au',
      'ं':'m','ः':'h','्':'','।':'','॥':'','ँ':'m'
    };
    return [...dev].map(ch=>map[ch]||'').join('');
  });
  return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/ā/g,'a').replace(/ī/g,'i').replace(/ū/g,'u')
    .replace(/ṛ|ṝ/g,'ri').replace(/ś|ṣ/g,'sh')
    .replace(/ñ|ṅ|ṇ/g,'n').replace(/ṃ|ṁ/g,'m').replace(/ḥ/g,'h')
    .replace(/chh/g,'ch').replace(/aa/g,'a').replace(/ii/g,'i').replace(/uu/g,'u')
    .replace(/[.,!?;:"'()।॥\-]/g,'').replace(/\s+/g,' ').trim();
}
function answersMatch(val, answer, also){
  const v=foldSa(val);
  if(!v) return false;
  const cands=[answer].concat(also||[]);
  return cands.some(c=>foldSa(c)===v);
}

function squeezeSa(s){
  return foldSa(s)
    .replace(/sh/g,'s').replace(/ch/g,'c').replace(/ph/g,'f').replace(/th/g,'t').replace(/dh/g,'d').replace(/bh/g,'b').replace(/gh/g,'g').replace(/kh/g,'k')
    .replace(/w/g,'v').replace(/y/g,'i')
    .replace(/[^a-z0-9]+/g,'').replace(/(.)\1+/g,'$1');
}
function editDist(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const row=new Array(n+1);
  for(let j=0;j<=n;j++) row[j]=j;
  for(let i=1;i<=m;i++){
    let prev=row[0]; row[0]=i;
    for(let j=1;j<=n;j++){
      const tmp=row[j];
      row[j]=a[i-1]===b[j-1] ? prev : 1+Math.min(prev, row[j], row[j-1]);
      prev=tmp;
    }
  }
  return row[n];
}
function closeEnough(a,b){
  if(!a || !b) return false;
  if(a===b || a.includes(b) || b.includes(a)) return true;
  const d=editDist(a,b), max=Math.max(a.length,b.length);
  if(max<=5) return d<=2;
  if(max<=8) return d<=3;
  return d/max<=0.45;
}
const HEAR_STOP=new Set(['the','a','an','is','am','are','my','i','and','to','of','in','it','that','this','hai','hoon','ho','hain','ka','ki','ke','ek','main','mai','mein']);
function tokensOf(s){
  return foldSa(s).split(' ').filter(w=>w && !HEAR_STOP.has(w) && w.length>1);
}
const HEAR_ALIASES={
  namaste:['namaste','namaskar','namaskaar','namastay','namastey','namasteh','hello','hi','नमस्ते','नमस्कार'],
  dhanyavadah:['dhanyavad','dhanyavaad','dhanyavadah','shukriya','shukriyaa','thanks','thank you','thankyou','धन्यवाद','धन्यवादः'],
  aham:['aham','ahaam','hum','main','mai','mein','i am','अहम्','मैं'],
  asmi:['asmi','asmee','asme','hoon','hun','hu','am','अस्मि'],
  asti:['asti','astee','aste','hai','is','अस्ति'],
  mama:['mama','mera','meraa','my name','mera naam','मम'],
  punarmilamah:['punarmilamah','punarmilama','phir milenge','alvida','bye','goodbye','see you','पुनर्मिलामः']
};
function aliasKey(expected){
  const f=foldSa(expected);
  if(HEAR_ALIASES[f]) return f;
  if(f.indexOf('namast')===0 || f.indexOf('namask')===0) return 'namaste';
  if(f.indexOf('dhanyav')===0) return 'dhanyavadah';
  if(f.indexOf('punarmil')===0) return 'punarmilamah';
  if(f.indexOf('mama nam')===0 || f.indexOf('mam nam')===0) return 'mama';
  if(f==='aham' || f==='aham asmi' || f.indexOf('aham')===0) return 'aham';

function heardMatches(heard, expected, expectedEn){
  const h=foldSa(heard), e=foldSa(expected);
  if(!h || !e) return false;
  if(closeEnough(h,e) || closeEnough(squeezeSa(h), squeezeSa(e))) return true;
  const key=aliasKey(expected);
  if(key){
    const pool=HEAR_ALIASES[key]||[];
    const hs=squeezeSa(h);
    if(pool.some(a=>{
      const fa=foldSa(a), sa=squeezeSa(a);
      return h===fa || hs===sa || h.includes(fa) || fa.includes(h) || closeEnough(hs,sa) || closeEnough(h,fa);
    })) return true;
  }
  const ht=tokensOf(h), et=tokensOf(e);
  if(et.length){
    const hit=et.filter(t=>ht.some(x=>closeEnough(squeezeSa(x), squeezeSa(t)))).length;
    if(hit/et.length>=0.45) return true;
  }
  if(expectedEn){
    const en=foldSa(expectedEn), ens=squeezeSa(en), hs=squeezeSa(h);
    if(closeEnough(h,en) || closeEnough(hs,ens)) return true;
    const ent=tokensOf(en);
    if(ent.length){
      const hit=ent.filter(t=>ht.some(x=>closeEnough(squeezeSa(x), squeezeSa(t)))).length;
      if(hit/ent.length>=0.5) return true;
    }

}

function startListen(expected, expectedEn, btn, fb){
  const Rec=window.SpeechRecognition || window.webkitSpeechRecognition;

    fb.textContent='The microphone needs https (or tap “I said it” — that still counts).';

  }
  stopListen();
  stopSpeaking();
  Music.speechOn=false;
  Music.micMute=true;
  applyBgGain();

  Listen.active=true;
  Listen.btn=btn;
  btn.classList.add('listening');
  const cue=String(expected||'').replace(/[!.?।॥]+$/g,'').trim();
  fb.textContent='Listening… say “'+cue+'” now!';
  fb.className='qfeedback';

  const alts=[];

  const finish=()=>{
    if(!Listen.active) return;

    if(Listen.timer){ clearTimeout(Listen.timer); Listen.timer=null; }
    if(Listen.snap){ clearTimeout(Listen.snap); Listen.snap=null; }
    if(rec){
      rec.onresult=rec.onerror=rec.onend=null;
      try{ rec.stop(); }catch(e){}
      Listen.rec=null;
    }
    btn.classList.remove('listening');
    Listen.btn=null;
    Music.micMute=false;
    applyBgGain();
    if(won) return;
    if(alts.length){
      fb.textContent='I heard “'+alts[0]+'”. Brave try! Tap “I will say it” again, or “I said it” — that still counts.';
      fb.className='qfeedback try';
    } else {
      fb.textContent='I didn’t catch it. Speak a little louder after you tap, or tap “I said it”. That still counts!';
      fb.className='qfeedback try';
    }
  };
  const succeed=(heard)=>{
    if(won) return;

    fb.textContent= looksLike ? 'Yes! I heard you: “'+heard+'”. ✓' : 'Yes! That sounded like '+cue+'. ✓';
    fb.className='qfeedback ok';
    finish();
    playSfx('ok');
  };
  const scoreNow=()=>{
    if(!Listen.active || won) return;
    const hit=alts.find(a=>heardMatches(a, expected, expectedEn));
    if(hit) succeed(hit);
    else finish();
  };
  const bootRec=(lang)=>{
    if(!Listen.active || won) return;
    if(Listen.rec){
      const old=Listen.rec;
      old.onresult=old.onerror=old.onend=null;
      try{ old.abort(); }catch(e){}
      Listen.rec=null;
    }
    const r=new Rec();
    Listen.rec=r;
    r.lang=lang||'hi-IN';
    r.interimResults=true;
    r.continuous=false;
    r.maxAlternatives=8;
    try{
      const GL=window.SpeechGrammarList||window.webkitSpeechGrammarList;

        const g=new GL();
        const rom=foldSa(cue);
        const bits=[cue, rom, 'नमस्ते', 'namaste', 'धन्यवादः', 'dhanyavadah', 'अहम्', 'aham', 'अस्मि', 'asmi']
          .filter(Boolean).map(w=>w.replace(/[()|;<>]/g,'')).filter(w=>w);

      if(!Listen.active || won) return;

        fb.className='qfeedback try';

        finish();
        return;
      }
      if(err==='audio-capture'){
        fb.textContent='No microphone found. Tap “I said it” after you say the line.';
        fb.className='qfeedback try';
        won=true;
        finish();
      }
    };
    r.onend=()=>{

          return;
        }
        finish();
        return;
      }
      if(restarts<1){

        return;
      }

    };
    try{ r.start(); }
    catch(e){

      fb.className='qfeedback try';

    }

function phase(card, skill, title, blurb){

function renderListenAll(card, words){
  const row=document.createElement('div'); row.className='btnrow';
  const b=document.createElement('button'); b.className='btn'; b.textContent='🔊 Play all — just listen (no peeking, honour system)';
  b.onclick=()=>{
    let i=0;
    const step=()=>{
      if(i>=words.length) return;
      speak(words[i], state.rate, ()=>setTimeout(()=>{ i++; step(); }, 140));
    };
    step();
  };
  row.appendChild(b);
  const tip=document.createElement('p'); tip.className='note';
  tip.textContent='Close your eyes if you like. Hear the music of the words before you look at letters. (Peeking is for later. Shuka is watching. Kindly.)';
  card.appendChild(tip);
  card.appendChild(row);
}
function renderWriteFromEnglish(card, items){
  if(!items || !items.length) return;
  sectionLabel(card,'Write the Sanskrit');
  const note=document.createElement('p'); note.className='note';
  note.textContent='Type in simple roman letters (namaste, aham asmi) or देवनागरी if you can. Spelling is allowed to be brave. Tap the speaker only after you have tried.';
  card.appendChild(note);
  const wrap=document.createElement('div');
  items.forEach((it)=>{
    const row=document.createElement('div'); row.className='fillrow';
    const lab=document.createElement('span'); lab.textContent=it.en+' →';
    row.appendChild(lab);
    const input=document.createElement('input');
    input.placeholder='Sanskrit'; input.autocomplete='off';
    input.style.width='min(100%, 280px)';
    input.oninput=()=>{
      if(!input.value.trim()){ input.classList.remove('ok','bad'); return; }
      if(answersMatch(input.value, it.answer, it.also)){ input.classList.add('ok'); input.classList.remove('bad'); }
      else { input.classList.remove('ok'); input.classList.add('bad'); }
    };
    row.appendChild(input);
    wireSaInput(input, (dev)=>{
      if(answersMatch(dev, it.answer, it.also) || answersMatch(input.value, it.answer, it.also)){
        input.classList.add('ok'); input.classList.remove('bad');
      }
    });
    row.appendChild(speakerBtn(it.also && it.also.find(x=>/[\u0900-\u097F]/.test(x)) || it.answer));
    wrap.appendChild(row);
  });
  card.appendChild(wrap);
}

}

}
function sectionLabel(card, text){
  const l=document.createElement('div'); l.className='section-label'; l.textContent=text; card.appendChild(l); return l;
}
function actBox(card, text){

}
function renderShlokaCard(card, shloka, opts){

  box.innerHTML=`<div class="sh-kicker">${shloka.kicker}</div>
    <h3>${opts.heading || ('📿 '+shloka.title)}</h3>

    <div class="shloka-en">${shloka.en}</div>`;

  hear.onclick=()=>speak(shloka.speak, state.rate);
  const slow=document.createElement('button'); slow.className='btn ghost'; slow.textContent='🐢 Slow chant';
  slow.onclick=()=>speak(shloka.speak, 0.72);

    renderChant(card, shloka.chant, 'Clap and chant — this is the bit to memorise', 'Say it three times. Silly voice on round two. Superhero voice on round three.');

function addNumberTry(card, max, wordFn){
  sectionLabel(card,'Try any number');
  const tryNote=document.createElement('p'); tryNote.className='note';
  tryNote.textContent='Type any number from 0 to '+max+' to see how it is written in Sanskrit, then tap the speaker to hear it.';
  card.appendChild(tryNote);
  const tryRow=document.createElement('div'); tryRow.className='fillrow';
  const tryInput=document.createElement('input');
  tryInput.type='number'; tryInput.min='0'; tryInput.max=String(max); tryInput.placeholder='e.g. 12'; tryInput.style.width='110px';
  tryRow.appendChild(tryInput);
  const tryArrow=document.createElement('span'); tryArrow.textContent='→'; tryArrow.style.cssText='color:var(--ink-soft);';
  tryRow.appendChild(tryArrow);
  const tryWord=document.createElement('span');
  tryWord.style.cssText="font-family:'Noto Sans Devanagari',sans-serif;font-weight:700;font-size:22px;color:var(--ink);min-width:140px;display:inline-block;";
  tryWord.textContent='...';
  tryRow.appendChild(tryWord);
  const trySpk=document.createElement('button'); trySpk.className='spk'; trySpk.innerHTML='🔊'; trySpk.title='Hear pronunciation'; trySpk.disabled=true;
  tryRow.appendChild(trySpk);
  card.appendChild(tryRow);
  function updateTryWord(){
    const n=parseInt(tryInput.value,10);
    if(isNaN(n) || n<0 || n>max){
      tryWord.textContent = tryInput.value==='' ? '...' : 'Please enter 0–'+max;
      tryWord.style.color = tryInput.value==='' ? 'var(--ink)' : 'var(--berry)';
      trySpk.disabled=true;
      return;
    }
    tryWord.textContent = wordFn(n);
    tryWord.style.color='var(--ink)';
    trySpk.disabled=false;
  }
  tryInput.oninput=updateTryWord;
  trySpk.onclick=()=>{
    const n=parseInt(tryInput.value,10);
    if(!isNaN(n) && n>=0 && n<=max) speak(wordFn(n), 0.75);
  };
}

function renderKatha(root){
  if(!STORIES.some(s=>s.id===state.storyId)) state.storyId='vedark';
  const story=STORIES.find(s=>s.id===state.storyId) || STORIES[0];
  const asShelf=state.current==='stories';
  if(!asShelf) renderRecap(root, 'katha');
  const card=moduleShell(
    asShelf ? 'Story shelf — kids’ Sanskrit tales' : `A little story — ${glossHTML('कथा','story')}`,
    'Pick a story below. There are '+STORIES.length+' short tales. Garden and forest friends, all kid-safe. Word help stays under the passage.'
  );
  const shelf=document.createElement('p'); shelf.className='story-shelf-label';
  shelf.textContent='Tap a story card — '+STORIES.length+' to choose from';
  card.appendChild(shelf);
  const grid=document.createElement('div'); grid.className='story-grid';
  STORIES.forEach((s)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='story-card'+(s.id===story.id?' on':'');
    b.innerHTML=`<span class="st">${s.id===story.id?'📖 ':''}${s.title}</span><span class="sb">${s.blurb}</span>`;
    b.onclick=()=>{
      state.storyId=s.id;
      if(asShelf) state.current='stories';
      render();
      requestAnimationFrame(()=>document.getElementById('story-now')?.scrollIntoView({behavior:'smooth',block:'start'}));
    };
    grid.appendChild(b);
  });
  card.appendChild(grid);
  lsrwRail(card);
  explainer(card, `<strong>Don’t panic if you don’t understand every word!</strong> These are kids’ stories. Listen first, speak a few lines, then read the whole passage. You only need to finish one quiz to clear Level 11. The rest are extra fun.`);
  ottoSays(card, story.shuka);
  if(story.act) actBox(card, story.act);
  phase(card,'L','1 👂 Listen','Play the whole passage. Get the gist first. Act along if you like — Sanskrit likes movers.');
  const listenRow=document.createElement('div'); listenRow.className='btnrow';
  const speakStory=()=>speak(story.text.replace(/\s+/g,' ').trim(), state.rate);
  const spkBtn=document.createElement('button'); spkBtn.className='btn'; spkBtn.textContent='🔊 Listen to the whole story';
  spkBtn.onclick=speakStory;
  listenRow.appendChild(spkBtn);
  addSarvamTranslate(listenRow, story.text);
  card.appendChild(listenRow);
  phase(card,'S','2 🗣️ Speak','Echo one sentence at a time.');
  renderSpeakAlong(card, story.lines);
  if(story.song){
    sectionLabel(card, '🎶 '+story.song.title);
    const note=document.createElement('p'); note.className='note';
    note.textContent='A little garden chant to sing. Made for this app.';
    card.appendChild(note);
    const song=document.createElement('div'); song.className='songbox'; song.textContent=story.song.verses;
    card.appendChild(song);
    const songRow=document.createElement('div'); songRow.className='btnrow';
    const hearSong=document.createElement('button'); hearSong.className='btn ghost'; hearSong.textContent='🔊 Hear the song';
    hearSong.onclick=()=>speak(story.song.verses.replace(/\s+/g,' ').trim(), state.rate);
    songRow.appendChild(hearSong);
    card.appendChild(songRow);
    renderSpeakAlong(card, story.song.lines);
  }
  phase(card,'R','3 📖 Read','Read it as a passage. Meanings live in Word help below.');
  const now=document.createElement('div'); now.id='story-now';
  card.appendChild(now);
  sectionLabel(card, story.title);
  const p=document.createElement('div'); p.className='passage';
  story.text.split(/\n\s*\n/).forEach((chunk)=>{
    const para=document.createElement('p'); para.textContent=chunk.trim();
    p.appendChild(para);
  });
  card.appendChild(p);
  const hearRow=document.createElement('div'); hearRow.className='btnrow';
  const hearAll=document.createElement('button'); hearAll.className='btn ghost'; hearAll.textContent='🔊 Hear the whole story';
  hearAll.onclick=speakStory;
  hearRow.appendChild(hearAll);
  addSarvamTranslate(hearRow, story.text);
  card.appendChild(hearRow);
  const panel=document.createElement('div'); panel.className='glossary-panel';
  panel.innerHTML=`<h3>Word help — every word</h3><p class="hint">Little words too: च = and, अपि = also, न = not. Endings like उद्याने mean <em>in</em> the garden, मयूराय means <em>to</em> the peacock.</p>`;
  const g=document.createElement('div'); g.className='glossary-grid';
  fullGlossary(story).forEach(([w,m])=>{
    const item=document.createElement('div'); item.className='glossary-item';
    const strong=document.createElement('strong'); strong.textContent=w;
    const en=document.createElement('span'); en.className='en'; en.textContent=' — '+m;
    item.appendChild(strong); item.appendChild(en);
    item.appendChild(speakerBtn(w));
    g.appendChild(item);
  });
  panel.appendChild(g);
  card.appendChild(panel);
  if(story.shloka){
    const sh=shlokaById(story.shloka);
    if(sh){
      sectionLabel(card, '📿 A Panchatantra rhyme to keep');
      const note=document.createElement('p'); note.className='note';
      note.textContent='This story has a tiny wise rhyme. Hear it. Clap it. Keep it in your pocket.';
      card.appendChild(note);
      renderShlokaCard(card, sh);
    }
  }
  phase(card,'W','4 ✍️ Write','These questions are about the story you just read.');
  sectionLabel(card,'Comprehension questions');
  renderQuiz(card, story.questions, (score,total)=>{ if(score>=total-1) markDone('katha'); });
  root.appendChild(card);
}

function renderRevision(root){

  card.appendChild(cardEl);

}

  if(state.justCleared){
    const clearedLv=levelById(state.justCleared);
    const nxtLv=nextStoryLevel(state.justCleared);
    const overlay=document.createElement('div'); overlay.className='level-up';
    const box=document.createElement('div'); box.className='level-up-card';
    const finishedAll=clearedLv && clearedLv.level===STORY_LEVELS.length;
    box.innerHTML=`<div class="burst">${finishedAll?'🪷🦚':'🦚'}</div>
      <h3>${finishedAll?'Garden map complete!':'Level '+clearedLv.level+' cleared!'}</h3>
      <p>${finishedAll
        ? 'You finished every beginner level. More levels will appear as you grow. Mayura packed extra feathers. Shuka packed pride (and one mango).'
        : (clearedLv.label+' is yours. '+clearedLv.en+'. The next garden gate just opened.')}</p>`;
    const row=document.createElement('div'); row.className='btnrow'; row.style.justifyContent='center';
    const stay=document.createElement('button'); stay.className='btn ghost'; stay.textContent='Stay here';
    stay.onclick=()=>{ state.justCleared=null; overlay.remove(); };
    row.appendChild(stay);
    if(nxtLv){
      const go=document.createElement('button'); go.className='btn';
      go.textContent='Next: Level '+nxtLv.level+' · '+nxtLv.label+' →';
      go.onclick=()=>{ state.justCleared=null; goTo(nxtLv.id); };
      row.appendChild(go);
    } else {
      const park=document.createElement('button'); park.className='btn';
      park.textContent='Visit Practice park →';
      park.onclick=()=>{ state.justCleared=null; goTo('revision'); };
      row.appendChild(park);
      const again=document.createElement('button'); again.className='btn ghost';
      again.textContent='🔁 Start again';
      again.onclick=()=>{ state.justCleared=null; state.confirmReset=true; render(); };
      row.appendChild(again);
    }
    box.appendChild(row);
    overlay.appendChild(box);
    app.appendChild(overlay);
    speak('सम्यक्!');
  }

  if(state.confirmReset){
    const overlay=document.createElement('div'); overlay.className='level-up';
    const box=document.createElement('div'); box.className='level-up-card';
    box.innerHTML=`<div class="burst">🔁</div>
      <h3>Start again?</h3>
      <p>This clears every star. You will begin at Level 1 — नमस्ते. Locked path or Free play stays as you left it. Shuka will pretend this is a brand-new journey.</p>`;
    const row=document.createElement('div'); row.className='btnrow'; row.style.justifyContent='center';
    const cancel=document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='Keep my stars';
    cancel.onclick=()=>{ state.confirmReset=false; overlay.remove(); };
    const yes=document.createElement('button'); yes.className='btn'; yes.textContent='Yes, start again';
    yes.onclick=()=>resetProgress();
    row.appendChild(cancel); row.appendChild(yes);
    box.appendChild(row);
    overlay.appendChild(box);
    app.appendChild(overlay);
  }
}

render();
['pointerdown','keydown'].forEach(ev=>{
  document.addEventListener(ev, ensureMusic, true);
});
ensureMusic();
</script>
</body>
</html>
